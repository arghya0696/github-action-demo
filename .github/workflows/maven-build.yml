name: Spring Boot Build and Test with AI Self-Healing

on:
  push:
    branches: [ "feature-gha-testing" ]
  pull_request:
    branches: [ "master", "main", "develop" ]
  workflow_dispatch:  # Allow manual trigger for testing

# Grants the GITHUB_TOKEN permission to push branches and create PRs
permissions:
  contents: write
  pull-requests: write
  checks: read

env:
  # API quota management
  MAX_API_CALLS_PER_DAY: 20
  ANTHROPIC_MODEL: claude-3-5-haiku-20241022  # Most cost-effective for CI/CD
  ENABLE_SELF_HEALING: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    outputs:
      build_status: ${{ job.status }}
      test_failure_detected: ${{ steps.maven-build.outcome == 'failure' }}

    steps:
      # ============================================
      # Step 1: Checkout and Setup
      # ============================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important: Fetch all history for git push

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pyyaml requests gitpython
        env:
          PIP_INDEX_URL: https://pypi.org/simple/

      # ============================================
      # Step 2: Maven Build and Tests
      # ============================================
      - name: Run Maven Clean Install
        id: maven-build
        continue-on-error: true  # Continue even if tests fail
        run: |
          echo "=== Starting Maven Build and Tests ==="
          mvn clean install -B -X 2>&1 | tee build.log
          BUILD_EXIT=$?
          echo "BUILD_EXIT=$BUILD_EXIT" >> $GITHUB_OUTPUT
          exit $BUILD_EXIT

      - name: Archive Maven Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-logs
          path: |
            build.log
            target/surefire-reports/
          retention-days: 7

      # ============================================
      # Step 3: AI Self-Healing Analysis and Fix
      # ============================================
      - name: Detect Test Failures
        id: detect-failures
        if: failure()
        run: |
          echo "=== Analyzing Test Failures ==="
          
          # Check for surefire reports
          if [ -d "target/surefire-reports" ]; then
              echo "failure_detected=true" >> $GITHUB_OUTPUT
              echo "Reports found in target/surefire-reports"
              ls -la target/surefire-reports/
          else
              echo "failure_detected=false" >> $GITHUB_OUTPUT
              echo "No surefire reports found"
          fi

      - name: AI Self-Healing Stage
        id: self-healing
        if: |
          failure() && 
          env.ENABLE_SELF_HEALING == 'true' &&
          steps.detect-failures.outputs.failure_detected == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_WORKFLOW: ${{ github.workflow }}
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          python .github/scripts/self_healer_claude.py \
            --workspace "$GITHUB_WORKSPACE" \
            --build-log "build.log" \
            --api-tier "standard" \
            --max-errors 5 \
            --create-pr

      - name: Self-Healing Result
        id: healing-result
        if: always()
        run: |
          if [ "${{ steps.self-healing.outcome }}" == "success" ]; then
              echo "✅ Self-healing completed successfully"
              echo "result=success" >> $GITHUB_OUTPUT
          elif [ "${{ steps.self-healing.outcome }}" == "failure" ]; then
              echo "⚠️  Self-healing encountered issues but pipeline continues"
              echo "result=partial" >> $GITHUB_OUTPUT
          else
              echo "⏭️  Self-healing was skipped (conditions not met)"
              echo "result=skipped" >> $GITHUB_OUTPUT
          fi

      # ============================================
      # Step 4: Summary and Reporting
      # ============================================
      - name: Generate Pipeline Summary
        if: always()
        run: |
          echo "================================================"
          echo "         PIPELINE EXECUTION SUMMARY"
          echo "================================================"
          echo "Build Status: ${{ job.status }}"
          echo "Maven Build: ${{ steps.maven-build.outcome }}"
          echo "Failures Detected: ${{ steps.detect-failures.outputs.failure_detected }}"
          echo "Self-Healing: ${{ steps.healing-result.outputs.result }}"
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "================================================"

      - name: Create Failure Annotation
        if: failure() && steps.healing-result.outputs.result != 'success'
        run: |
          echo "::notice title=Build Failed::The build failed and automatic remediation was attempted. Check logs for details."

      - name: Notify Success
        if: success()
        run: |
          echo "::notice title=Build Success::✅ All tests passed!"

  # ============================================
  # Optional: Validation Job for Generated PRs
  # ============================================
  validate-ai-fix:
    needs: build
    if: failure()  # Only run if main build failed
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check for AI-Generated PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Checking for AI-generated PRs ==="
          
          # List recent PRs with AI label
          gh pr list \
            --search "label:🤖-ai-generated" \
            --state open \
            --limit 5 \
            --json number,title,createdAt

      - name: Run Quality Checks on AI Fixes
        run: |
          echo "Future: Implement automated review of AI-generated code"
          echo "- Run linters on changed files"
          echo "- Check test coverage"
          echo "- Verify compilation"

# ==============================================
# Workflow Rules and Guardrails
# ==============================================
# 1. Self-healing only runs on failure
# 2. Never auto-merge AI-generated code
# 3. Always require human review for PRs
# 4. Log all API calls for audit trail
# 5. Fail gracefully - don't break pipeline
