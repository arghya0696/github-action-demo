name: Spring Boot Build and Test

on:
  push:
    branches: ["feature-PR-gen"]
  pull_request:
    branches: ["feature-PR-gen"]
  workflow_dispatch:  # Allow manual trigger for testing

# Grants the GITHUB_TOKEN permission to push branches and create PRs
permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Fetch all history for git push to work

      # - name: Setup GitHub CLI
      #   run: |
      #     echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token  

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install google-generativeai

      - name: Stage 1 - Print starting
        run: echo "Starting..."

      - name: Stage 2 - Run Maven Clean Install
        run: mvn clean install

      - name: Stage 4 - AI Self-Healing Agent
        # ONLY runs if the previous Maven Test step fails
        if: failure()
        env:
          # This maps the secret to an environment variable in the Ubuntu runner
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_EXCEPTIONS: "java.lang.NullPointerException,java.lang.ClassCastException,java.lang.IndexOutOfBoundsException,java.lang.IllegalArgumentException"
        run: |
          echo "Tests failed. Invoking AI self-healing script..."
          pip install anthropic
          python .github/scripts/self_healer.py

      - name: Stage 5 - Upload AI PR Metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pr-metadata
          path: ai_pr_metadata.json
          if-no-files-found: ignore

      - name: Stage 6 - Print Result
        if: always()
        run: |
          echo "Done with test. Result: ${{ job.status }}"

  # ============================================
  # Optional: Validation Job for Generated PRs
  # ============================================
  validate-ai-fix:
    needs: build
    if: needs.build.result == 'failure'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download PR Metadata
        uses: actions/download-artifact@v4
        with:
          name: ai-pr-metadata

      - name: Read PR Metadata
        id: pr_metadata
        run: |
          cat ai_pr_metadata.json
          PR_URL=$(jq -r '.pr_url' ai_pr_metadata.json)
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Run Quality Checks on AI Fixes
        run: |
          echo "Future: Implement automated review of AI-generated code"
          echo "- Run linters on changed files"
          echo "- Check test coverage"
          echo "- Verify compilation"