name: Spring Boot Build and Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Check out the repository code
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Stage 1 - Print starting
      run: echo "Starting..."

    - name: Stage 2 - Run Maven Clean Install
      run: mvn clean install -DskipTests

    - name: Stage 3 - Run Maven Test
      run: mvn test

    - name: Stage 4 - Print Result
      if: always()
      run: | 
        echo Done with test. Result: ${{ job.status }}